<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- (c) Sanjak Tech — Daftar Al-Mandoob demo. All rights reserved. -->
<base target="_top">
<meta charset="utf-8">
<title>تجربة دفتر المندوب | السنجك تك</title>
<meta name="description" content="جرّب دفتر المندوب مباشرة ببيانات أمثلة: الطلبات ومستحقات الشركات والبنزين والتقارير.">
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<style>

:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --sunk:#E8EAEE; --ink:#15181C; --muted:#5D6570; --line:#D9DDE3;
  --accent:#F2B705; --accent-ink:#17150D; --hdr:#1C1F24; --hdr-ink:#F2F3F5;
  --pos:#1D7F55; --neg:#BF3B28; --info:#2E64C8; --pos-bg:#E3F3EA; --neg-bg:#F9E6E2;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#1A1D22; --sunk:#22262C; --ink:#ECEEF1; --muted:#9BA3AE; --line:#2C3138;
  --accent:#F5C22E; --accent-ink:#17150D; --hdr:#0B0C0E; --hdr-ink:#F2F3F5;
  --pos:#3DBA80; --neg:#EE6B56; --info:#6F9BF0; --pos-bg:#16301F; --neg-bg:#3A1C17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1A1D22; --sunk:#22262C; --ink:#ECEEF1; --muted:#9BA3AE; --line:#2C3138;
  --accent:#F5C22E; --accent-ink:#17150D; --hdr:#0B0C0E; --hdr-ink:#F2F3F5;
  --pos:#3DBA80; --neg:#EE6B56; --info:#6F9BF0; --pos-bg:#16301F; --neg-bg:#3A1C17; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.num,.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
#app{direction:rtl;max-width:760px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-ink);padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:0}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:#A9B0BA}
.lane{height:4px;margin-top:12px;background:repeating-linear-gradient(90deg,var(--accent) 0 26px,transparent 26px 44px)}
.hdr-btn{border:1px solid #3A4049;background:none;color:var(--hdr-ink);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.hdr-btn[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.status{font-size:12px;color:#A9B0BA;text-align:left}
.status b{color:var(--accent);font-weight:600}
main>*{min-width:0}
main{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
/* period chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.custom-range{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.custom-range .rng{flex:1 1 140px;display:grid;gap:3px;min-width:0}
.custom-range .rng span{font-size:12px;font-weight:600;color:var(--muted)}
/* hero numbers */
.hero{background:var(--hdr);color:var(--hdr-ink);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.hero .lbl{font-size:12.5px;color:#A9B0BA}
.hero .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1}
.hero .big.neg{color:#FF8A75}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed #3A4049;padding-top:12px}
.hero-grid div{min-width:0}
.hero-grid .v{font-weight:600;font-size:16px}
.bal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button.bal{font:inherit;color:inherit;text-align:right;width:100%;cursor:pointer}
button.bal:hover{border-color:var(--muted)}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.bal .v{font-family:var(--f-display);font-weight:700;font-size:18px;margin-top:2px;overflow-wrap:anywhere}
.bal .t{font-size:12.5px;color:var(--muted)}
.co-row{display:flex;align-items:center;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.co-row:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.co-row .nm{flex:1;min-width:0;font-weight:600}
.co-row .st{font-size:12px;color:var(--muted);font-weight:400}
.co-row .amt{font-weight:700;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
/* quick add */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 6px;display:grid;gap:4px;justify-items:center;font-size:12.5px;font-weight:600}
.quick .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px}
.ic-o{background:var(--accent);color:var(--accent-ink)}
.ic-s{background:var(--pos-bg);color:var(--pos)}
.ic-x{background:var(--neg-bg);color:var(--neg)}
.ic-m{background:var(--sunk);color:var(--ink)}
/* entries */
.day{display:grid;gap:0}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 2px 8px;font-size:13px;color:var(--muted)}
.day-h b{color:var(--ink);font-weight:600}
.ent{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:right;background:none;border-left:0;border-right:0;border-bottom:0}
.ent:first-child{border-top:0}
.ent .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.ent .bd{flex:1;min-width:0}
.ent .t1{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .t2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .am{text-align:left;font-weight:700;font-size:14px;flex:none}
.ent.void .t1,.ent.void .am{text-decoration:line-through;opacity:.55}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-inline-start:6px;vertical-align:1px}
.tag.lock{background:var(--sunk);color:var(--muted)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
/* filters */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input{grid-column:1/-1}
input[type=text],input[type=password],input[type=date],input[type=number],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
input[inputmode=decimal],input[inputmode=numeric]{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:600;color:var(--muted);font-size:12px;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:left;white-space:nowrap}
tr.tot td{font-weight:700;border-bottom:2px solid var(--ink)}
tr.sub td{font-weight:600;background:var(--sunk)}
.stmt-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.stmt-line.ind{padding-inline-start:12px;color:var(--muted)}
.stmt-line.tot{font-weight:700;border-bottom:2px solid var(--ink)}
.stmt-line.grand{font-family:var(--f-display);font-weight:700;font-size:17px;border-bottom:0;padding-top:10px}
.ok-badge{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.ok-badge.ok{background:var(--pos-bg);color:var(--pos)}
.ok-badge.bad{background:var(--neg-bg);color:var(--neg)}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:11px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.jr{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.jr-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.metric{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.metric .v{font-weight:700;font-size:16px}
.metric .t{font-size:12px;color:var(--muted)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* bottom nav */
body.authmode nav.bottom{display:none}
nav.bottom{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;direction:rtl}
nav.bottom button{border:0;background:none;padding:9px 2px 10px;font-size:11.5px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:3px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--ink)}
nav.bottom button[aria-current="page"] svg{color:var(--ink)}
nav.bottom .add{position:relative}
nav.bottom .add span.plus{width:52px;height:52px;margin-top:-22px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:30px;font-weight:500;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;direction:rtl;padding-block:6px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:6px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.fld{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.fld>label,.fld>.lb{font-size:13px;font-weight:600;color:var(--muted)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:500}
.opt input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt input:focus-visible+span{outline:2px solid var(--info);outline-offset:2px}
.opts.col{display:grid;gap:6px}
.opts.col .opt span{width:100%}
.preview{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:12.5px}
.preview table{font-size:12.5px}
.preview td{padding:4px 4px}
.err{color:var(--neg);font-size:13px;font-weight:600;min-height:1em}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sheet-foot .btn{flex:1 1 auto;padding:11px 12px;font-size:14.5px}
.demo-bar{direction:rtl;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--accent);color:var(--accent-ink);font-size:13px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-bar .btn{border-color:var(--accent-ink)}.demo-bar .btn.pri{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);text-decoration:none}
.demo-btns{display:flex;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:30;direction:rtl;max-width:90vw}
.note-bar{background:var(--neg-bg);color:var(--neg);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.note-bar.info{background:var(--sunk);color:var(--ink);font-weight:500}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.set-list .co-row input[type=text]{flex:1}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid transparent;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
@media (max-width:420px){
  .hero .big{font-size:29px}
  .bal .v{font-size:16px}
  .bal-grid{grid-template-columns:1fr 1fr}
  .bal-grid .bal:first-child{grid-column:1/-1}
  .quick{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">دفتر المندوب<small id="hdrSub">حسابات التوصيل والسيارة <span id="hdrSync"></span></small></div>
      <div style="display:flex;align-items:center;gap:10px"><div class="status" id="hdrStatus">جاري التحميل…</div><button class="hdr-btn" data-nav="set" aria-label="الإعدادات"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    </div>
    <div class="lane"></div>
  </header>
  <div class="demo-bar" role="note"><span><b>نسخة تجريبية</b> · البيانات أمثلة، وأي شي تضيفه يرجع لوضعه الأصلي لما تحدّث الصفحة.</span><span class="demo-btns"><a class="btn sm pri" href="https://sanjaktech.com/try/mandoob/#price-title" target="_top">اشترِ الآن</a><button class="btn sm" data-act="demoreset">إعادة التجربة</button></span></div>
  <main id="main"></main>
  <nav class="bottom" aria-label="التنقل">
    <div class="in">
      <button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
      <button data-nav="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>الحركات</button>
      <button class="add" data-add="o" aria-label="إضافة حركة"><span class="plus">+</span></button>
      <button data-nav="cos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17h2l1.5-5h9L17 17h4M6 17a2 2 0 1 0 4 0M14 17a2 2 0 1 0 4 0M8 12l1-4h6"/></svg>الشركات</button>
      <button data-nav="rep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التقارير</button>
    </div>
  </nav>
</div>
